[project]
name = "semantic-segmentation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets==3.6.0",
    "einops>=0.8.2",
    "huggingface-hub>=0.30.2",
    "ipykernel>=6.29.5",
    "lightning>=2.5.1",
    "nuscenes-devkit>=1.1.11",
    "rope>=1.14.0",
    "safetensors>=0.5.3",
    "tensorboard>=2.19.0",
    "timm>=1.0.16",
    "torch>=2.6.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.21.0",
    "wandb>=0.19.9",
]

[project.optional-dependencies]
# CUDA 12.4 wheels (torch >= 2.6)
cu124 = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]
# CUDA 12.8 wheels (torch >= 2.7)
cu128 = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]
# CUDA 13.0 wheels (torch >= 2.9)
cu130 = [
    "torch>=2.9.0",
    "torchvision>=0.24.0",
]

[tool.uv]
# Only one CUDA build can be installed at a time.
conflicts = [
    [
        { extra = "cu124" },
        { extra = "cu128" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
